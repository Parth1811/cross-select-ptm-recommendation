epochs: 100

# Sample-level sampler knobs (see cross_select.data.dataset.SampleBatchGenerator).
# Per step: pick num_datasets_per_step datasets, load one shard from each,
# draw num_samples_per_dataset rows from that shard, subsample
# num_models_per_step models (shared across all K*S forwards in the step).
# Set num_models_per_step = full zoo size (32) to remove the step-to-step
# target-ranking jitter and train Model-Spider-style on all models.
num_models_per_step: 32
num_datasets_per_step: 4
num_samples_per_dataset: 4

# Kept for backward compatibility / eval; training does not use batch_size.
batch_size: 16

lr: 1.0e-4
weight_decay: 0.0
optimizer: adamw

# Gradient clipping (max L2 norm). Set to 0 or null to disable.
# Default is 1.0 since multi-layer attention training is sensitive to
# occasional large-gradient steps.
grad_clip: 1.0

# Opt-in fully-reproducible sampling. When true, each epoch re-seeds
# the sampler with base_seed + epoch_index so every epoch visits the
# same (shard, row, partner-picks) sequence across runs. Useful for
# noise-free A/B comparisons; leave false for normal training.
deterministic_sampling: false

# Optional LR schedule. kind ∈ {"constant", "cosine"}. cosine runs a
# linear warmup for warmup_steps then decays to lr*min_lr_mult by the
# final step. The trainer computes total_steps internally from
# epochs * sampler.steps_per_epoch().
schedule:
  kind: constant
  warmup_steps: 0
  min_lr_mult: 0.0

loss:
  # kind \u2208 {"listmle", "listmle_mse", "pairwise_bce", "compatibility"}:
  #   listmle      \u2013 Plackett-Luce ranking (Model Spider Eq. 4). Default.
  #   listmle_mse  \u2013 Weighted ListMLE + standardized MSE. Dense gradient
  #                  signal from MSE + listwise ordering from ListMLE.
  #                  Uses ranking_weight + mse_weight below.
  #   pairwise_bce \u2013 RankNet-style pairwise BCE. Smooth; no suffix-sum
  #                  explosion on bad top-of-list positions.
  #   compatibility\u2013 Legacy ListNet + MSE; kept for reproducing old runs.
  kind: listmle
  # pred_temperature applies to listmle and listmle_mse: pred is divided
  # by T before the softmax. T<1 sharpens (stronger top-position
  # gradient); T>1 softens. Default 1.0 matches the paper formula.
  pred_temperature: 1.0
  ranking_weight: 1.0
  mse_weight: 1.0
  # pairwise_bce only:
  margin: 0.0

# Evaluation protocol. mode ∈ {"prototype", "stochastic"}:
#   prototype = one deterministic mean-over-all-shards dataset token.
#   stochastic = draw n_seeds single-shard tokens, forward each, and
#   average the predicted scores. Matches training's E[f(x)] input
#   distribution (rather than the f(E[x]) that prototype evaluates),
#   which closes the train/eval mismatch observed in run e9m4pyte.
eval:
  mode: stochastic
  n_seeds: 16

log_every: 50
eval_every: 5
checkpoint_dir: artifacts/experiments/${now:%Y-%m-%d_%H-%M-%S}
