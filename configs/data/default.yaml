model_tokens_dir: ${oc.env:PTM_MODEL_TOKENS_DIR,${hydra:runtime.cwd}/artifacts/extracted/parc_model_embeddings}
dataset_root: ${oc.env:PTM_DATASET_ROOT,${hydra:runtime.cwd}/artifacts/extracted/datasets}
gt_path: ${oc.env:PTM_GT_PATH,${hydra:runtime.cwd}/constants/ground_truth_rankings.json}

# Folder names under dataset_root that should be used as datasets.
# Outer GT-JSON keys now match folder names (caltech_101, cifar_10, ...),
# so no name map is needed \u2014 identity is used everywhere.
# Only datasets whose tokens are actually materialized under dataset_root
# should be listed here. Add the remaining GT targets as you download them:
#   cub200, nabird, oxford_pets, stanford_dogs, voc2007
dataset_ids:
  - caltech_101
  - cifar_10

gt_dataset_name_map: {}

missing_value: random_rank
eval_split: validation
