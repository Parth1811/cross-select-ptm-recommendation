model_tokens_dir: ${oc.env:PTM_MODEL_TOKENS_DIR,${hydra:runtime.cwd}/artifacts/extracted/parc_model_embeddings}
dataset_root: ${oc.env:PTM_DATASET_ROOT,${hydra:runtime.cwd}/artifacts/extracted/datasets}
gt_path: ${oc.env:PTM_GT_PATH,${hydra:runtime.cwd}/constants/ground_truth_rankings.json}

# All 7 PARC target datasets. Outer GT-JSON keys match these folder names,
# so no name map is needed.
dataset_ids:
  - caltech_101
  - cifar_10
  - cub200
  - nabird
  - oxford_pets
  - stanford_dogs
  - voc2007

gt_dataset_name_map: {}

missing_value: random_rank
# Only caltech_101 and cifar_10 have validation shards; the other five have
# train + test only. Default to test so eval works uniformly across datasets.
eval_split: test
