name: cross_select_encoder
raw_dim: 8192
model_token_dim: 512
dataset_token_dim: 512
hidden_dim: 512
num_heads: 8
num_layers: 1
dropout: 0.1

# Encoder config (ablation knobs)
# encoder_kind ∈ {"autoencoder", "mlp", "linear"}
encoder_kind: autoencoder
encoder_hidden_dim: 1024
encoder_dropout: 0.05

# Reconstruction loss weight (only for autoencoder encoder_kind).
# Set to 0 to disable reconstruction loss.
reconstruction_weight: 0.1
