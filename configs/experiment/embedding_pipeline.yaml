# @package _global_
# Experiment 2: Standard Cross-Select with pre-computed 512-dim autoencoder embeddings.
# Uses the old ModelAutoEncoder pipeline output (no encoder co-training).
# Usage: python -m cross_select.cli.train experiment=embedding_pipeline
defaults:
  - /model: cross_select
  - /data: default

quadrant:
  id: 1
  name: embedding_pipeline
  held_out_models: []
  held_out_datasets: []

wandb:
  name: embedding-pipeline-512

model:
  num_layers: 4
