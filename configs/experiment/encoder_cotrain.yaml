# @package _global_
# Experiment 1: Co-train encoder + transformer on raw 8192-dim PARC vectors.
# The encoder (autoencoder) and cross-attention scorer train jointly end-to-end.
# Usage: python -m cross_select.cli.train experiment=encoder_cotrain
defaults:
  - /model: cross_select_encoder
  - /data: with_raw_vectors

quadrant:
  id: 1
  name: encoder_cotrain
  held_out_models: []
  held_out_datasets: []

wandb:
  name: encoder-cotrain-raw-8192

model:
  encoder_kind: autoencoder
  reconstruction_weight: 0.1
  num_layers: 4
